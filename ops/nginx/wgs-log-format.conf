# http context: no raw client IP, query string, user id, filename, cookie or UA.
map $uri $wgs_log_group {
    default "page";
    ~^/api/admin/ "admin";
    ~^/api/ "api";
    ~^/uploads/ "attachment";
    ~^/socket.io/ "realtime";
}
map $request_method $wgs_log_method {
    default "OTHER";
    GET "GET"; HEAD "HEAD"; POST "POST"; PUT "PUT";
    PATCH "PATCH"; DELETE "DELETE"; OPTIONS "OPTIONS";
}
log_format wgs_security escape=json '{"time":"$time_iso8601","method":"$wgs_log_method","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"group":"$wgs_log_group","limit":"$limit_req_status"}';
