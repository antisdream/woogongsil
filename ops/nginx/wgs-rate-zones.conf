# Include once from nginx's http context (e.g. /etc/nginx/conf.d/).
# API keys are empty for static assets, so classroom page assets are unaffected.
map $uri $wgs_api_limit_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
map $uri $wgs_question_limit_key {
    default "";
    ~^/api/(random-question|past-exam|ipep/(random-question|past-exam|three-week/questions))/?$ $binary_remote_addr;
}
limit_req_zone $wgs_api_limit_key zone=wgs_api:1m rate=30r/s;
limit_req_zone $wgs_question_limit_key zone=wgs_questions:1m rate=10r/s;
limit_conn_zone $wgs_api_limit_key zone=wgs_api_connections:1m;
