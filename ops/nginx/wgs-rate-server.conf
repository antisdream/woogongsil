# Include from the application HTTPS server block, after wgs-rate-zones.conf.
limit_req zone=wgs_api burst=120 nodelay;
limit_req zone=wgs_questions burst=60 nodelay;
limit_req_dry_run off;
limit_req_status 429;
limit_conn wgs_api_connections 120;
limit_conn_status 429;
client_body_timeout 15s;
client_header_timeout 15s;
error_page 429 = @wgs_rate_limited;
location @wgs_rate_limited {
    default_type application/json;
    add_header Retry-After 2 always;
    add_header Cache-Control no-store always;
    return 429 '{"success":false,"reason":"rate_limited","msg":"잠시 후 다시 시도해주세요.","retryAfter":2}';
}
